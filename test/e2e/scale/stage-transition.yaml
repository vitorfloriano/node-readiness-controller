apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: node-transition-custom-readiness
spec:
  resourceRef:
    apiGroup: ""
    kind: Node
  selector:
    matchLabels:
      type: kwok
    matchExpressions:
      - key: '.status.conditions.[] | select( .type == "custom/Ready" ) | .status'
        operator: In
        values:
          - "False"
  delay:
    durationMilliseconds: 5000
  next:
    statusTemplate: |
      {{- $now := Now }}
      conditions:
        - lastHeartbeatTime: {{ $now | Quote }}
          lastTransitionTime: {{ $now | Quote }}
          message: "Custom CNI is ready"
          reason: "CNIReady"
          status: "True"
          type: custom/Ready
